services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-slides}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: http://localhost:${APP_PORT:-8000}
      OPENROUTER_APP_NAME: MRXS Analysis Workbench
      ANALYSIS_MODELS: ${ANALYSIS_MODELS:-google/gemini-2.5-flash,openai/gpt-5.5,anthropic/claude-sonnet-5}
      MAX_CROP_PIXELS: ${MAX_CROP_PIXELS:-25000000}
      CORS_ORIGINS: http://localhost:${APP_PORT:-8000}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)" ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  minio:
    build:
      context: .
      dockerfile: rustfs.Dockerfile
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
       MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
       MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  minio_data:
